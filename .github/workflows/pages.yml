name: Publish ATN website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Build the ATN preview
        run: node prepare-pages.mjs "/${{ github.event.repository.name }}" "https://${{ github.repository_owner }}.github.io"
      - name: Check project links and interactive request routing
        run: node test-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .local/pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
